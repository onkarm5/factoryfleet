# Development broker only.
#
# Anonymous access is deliberate here and would be indefensible anywhere else: this broker is
# bound to a developer's machine and holds nothing. The real access model arrives with IoT
# Core in milestone 3, where every asset authenticates with its own X.509 certificate and
# carries a policy scoped to its own topic prefix, so a compromised machine cannot read or
# spoof another machine's traffic.

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# Messages are not persisted across broker restarts. Durability lives in the agent's outbox,
# which is the boundary that has to survive; a development broker that forgets is a useful
# test of exactly that.
persistence false

log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true
